name: release

# A version tag (v1.2.3) builds every binary and drafts a GitHub release; nothing is published.
# Publishing to npm and crates.io happens only from a manual run with `publish: true`, behind the
# `release` environment (configure required reviewers there). DECISIONS.md D39.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm and crates.io (needs NPM_TOKEN and CARGO_REGISTRY_TOKEN)"
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
          - { target: x86_64-apple-darwin, os: macos-13 }
          - { target: aarch64-apple-darwin, os: macos-14 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != Cargo.toml $version"; exit 1; }
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        run: ./target/${{ matrix.target }}/release/git-carve --version
      - uses: actions/upload-artifact@v4
        with:
          name: git-carve-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/git-carve
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Assemble npm packages
        run: |
          args=""
          for dir in dist/git-carve-*; do
            target=${dir#dist/git-carve-}
            args="$args $target=$dir/git-carve"
          done
          node scripts/npm-pack.mjs npm-out $args
      - name: Archives
        run: |
          mkdir -p archives
          for dir in dist/git-carve-*; do
            target=${dir#dist/git-carve-}
            chmod +x "$dir/git-carve"
            tar -C "$dir" -czf "archives/git-carve-$target.tar.gz" git-carve
          done
          (cd archives && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: npm-out
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: archives/*

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: package
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: npm-out
      - name: npm (platform packages first, then the shim)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in npm-out/linux-* npm-out/darwin-*; do
            chmod +x "$dir/bin/git-carve"
            (cd "$dir" && npm publish --access public)
          done
          (cd npm-out/git-carve && npm publish --access public)
      - name: crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
