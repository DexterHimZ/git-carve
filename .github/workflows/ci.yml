name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # macOS minutes cost 10x on private repositories: run it for version tags and manual
        # runs only; Linux runs on every push.
        exclude:
          - os: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && 'none' || 'macos-latest' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g typescript@5   # real-tsc tests (verify.rs) skip without it
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The evaluation harness and the judge flag build only with the `eval` feature (D60).
      - run: cargo clippy --all-targets --features eval -- -D warnings
      - run: cargo test --features eval
      # The shipped feature set, tested too.
      - run: cargo test
